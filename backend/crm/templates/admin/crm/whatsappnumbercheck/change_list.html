{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
  <form method="get">
    <fieldset class="module aligned">
      <div class="form-row">
        {{ form.number.errors }}
        <label for="{{ form.number.id_for_label }}">{% trans "Number" %}</label>
        {{ form.number }}
      </div>
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="{% trans "Check" %}" class="default">
    </div>
  </form>

  {% if result %}
  <div class="module">
    <table>
      <tr>
        <th>{% trans "Number" %}</th>
        <td>{{ result.number }}</td>
      </tr>
      <tr>
        <th>{% trans "Exists" %}</th>
        <td>{{ result.exists }}</td>
      </tr>
      <tr>
        <th>{% trans "WhatsApp ID" %}</th>
        <td>{{ result.whatsappId }}</td>
      </tr>
    </table>
  </div>
  {% endif %}
</div>
{% endblock %}
