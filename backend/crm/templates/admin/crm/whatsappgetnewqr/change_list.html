{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <form method="post">
    {% csrf_token %}
    <div class="submit-row">
      <input type="submit" value="Get new QR" class="default">
    </div>
  </form>

  {% if result %}
  <div class="module">
    <p>Status: {{ result.status }}</p>
    <img src="{{ result.qrCode }}" alt="WhatsApp QR">
  </div>
  {% endif %}
</div>
{% endblock %}
