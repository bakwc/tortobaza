{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
  <p>{% trans "Apply categorization rules to every expense without a category. Existing categories stay unchanged." %}</p>
  <form method="post">
    {% csrf_token %}
    <div class="submit-row">
      <input type="submit" value="{% trans "Apply rules to the entire database" %}" class="default">
      <a href="{% url 'admin:crm_financialtransaction_changelist' %}">{% trans "Cancel" %}</a>
    </div>
  </form>
</div>
{% endblock %}
