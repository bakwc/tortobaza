name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: [self-hosted, tortobaza]
    steps:
      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          cd /home/ubuntu/koding/tortobaza
          git fetch origin master
          target=$(git rev-parse origin/master)
          mkdir -p /home/ubuntu/.tortobaza
          STATUS_PATH=/home/ubuntu/.tortobaza/deploy.json ATTEMPTED_SHA="$target" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["STATUS_PATH"])
          data = {}
          if path.exists():
              data = json.loads(path.read_text())
          data["attempted_sha"] = os.environ["ATTEMPTED_SHA"]
          tmp = path.with_suffix(".json.tmp")
          tmp.write_text(json.dumps(data, indent=2) + "\n")
          tmp.replace(path)
          PY
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          git checkout master
          git merge --ff-only "$target"
          deployed=$(./deploy/deploy.sh)
          echo "sha=${deployed}" >> "$GITHUB_OUTPUT"

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const sha = '${{ steps.deploy.outputs.sha }}';
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'production',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark deployment failure
        if: failure() && steps.deploy.outputs.target != ''
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/home/ubuntu/.tortobaza/deploy.json', 'utf8'));
            const sha = data.attempted_sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'failure',
              environment: 'production',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
